# ───────────────────────────────────────────────
# Step 07: every image needs a real version tag. ":latest" or no tag
# means "whatever was pushed last": you can't know or roll back what runs.
# ───────────────────────────────────────────────
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: three-tier
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])
  validations:
    - expression: >-
        variables.containers.all(c, c.image.contains(':') && !c.image.endsWith(':latest'))
      message: "Use a fixed image tag like :v1 or the commit SHA. ':latest' and missing tags are not allowed."
