# ───────────────────────────────────────────────
# Step 07: images may come ONLY from our private ECR
# (or official images mirrored on ECR Public, like MySQL).
# ${ACCOUNT_ID} is filled in when you apply it (envsubst), so your
# account ID never goes into Git.
# ───────────────────────────────────────────────
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-image-registries
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: three-tier
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])
  validations:
    - expression: >-
        variables.containers.all(c,
          c.image.startsWith('${ACCOUNT_ID}.dkr.ecr.eu-north-1.amazonaws.com/') ||
          c.image.startsWith('public.ecr.aws/docker/library/'))
      message: "Images must come from our ECR (${ACCOUNT_ID}.dkr.ecr.eu-north-1.amazonaws.com) or public.ecr.aws/docker/library."
