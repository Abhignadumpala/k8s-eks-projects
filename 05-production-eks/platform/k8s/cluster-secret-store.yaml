# ───────────────────────────────────────────────
# Step 06: where External Secrets reads from: AWS Secrets Manager, eu-north-1.
# No "auth" block → it uses the controller's own Pod Identity role,
# which may read only abhigna-prod/three-tier/mysql (Terraform).
# ClusterSecretStore = usable from any namespace.
# ───────────────────────────────────────────────
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-north-1
