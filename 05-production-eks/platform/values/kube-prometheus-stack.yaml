# ───────────────────────────────────────────────
# Step 11: Prometheus + Grafana + Alertmanager
# Grafana's admin password is generated by the chart and stored in a
# Kubernetes Secret (never in Git). The UI is reached through an SSH tunnel.
# ───────────────────────────────────────────────
prometheus:
  prometheusSpec:
    retention: 2d
    # Pick up EVERY ServiceMonitor / PodMonitor / rule, not only this release's
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 200m
        memory: 1Gi

# EKS runs these for us in AWS: Prometheus can't scrape them (avoids false alerts)
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
