# ───────────────────────────────────────────────
# Step 06: External Secrets Operator
# Reads secrets from AWS Secrets Manager and writes them as Kubernetes Secrets.
# AWS access: Pod Identity on this ServiceAccount (Terraform), no keys.
# ───────────────────────────────────────────────
installCRDs: true

serviceAccount:
  create: true
  name: external-secrets               # matches the Pod Identity association (Terraform)
