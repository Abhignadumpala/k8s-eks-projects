# ───────────────────────────────────────────────
# Step 06: External Secrets copies the passwords from AWS Secrets Manager
# into the Kubernetes Secret "mysql-secret" (and refreshes it every hour).
# Git only holds the NAME of the AWS secret, never the passwords.
# ───────────────────────────────────────────────
{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mysql-secret
  labels:
    {{- include "three-tier.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.secretStore }}
  target:
    name: mysql-secret          # the Kubernetes Secret to create
    creationPolicy: Owner       # delete the ExternalSecret → the Secret goes too
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: password
    - secretKey: root-password
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: root-password
{{- end }}
