# ───────────────────────────────────────────────
# One ServiceAccount (identity) per tier.
#   - Istio uses them to decide who may talk to whom (Step 08)
#   - automountServiceAccountToken: false → no Kubernetes API token is put
#     inside the Pods. The app never calls the Kubernetes API, so a hacked
#     Pod has no token to steal (Step 04)
# ───────────────────────────────────────────────
{{- range $name := list "frontend" "backend" "mysql" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    {{- include "three-tier.labels" $ | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
