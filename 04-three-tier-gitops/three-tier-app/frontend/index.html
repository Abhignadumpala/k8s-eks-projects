<!doctype html>
<!-- Frontend (tier 1): static page served by nginx. Calls the backend through /api -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3-Tier Task List</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; background: #f5f7fa; color: #1f2933; }
    h1 { margin-bottom: 4px; }
    .tiers { color: #616e7c; font-size: 14px; margin-bottom: 24px; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px; border: 1px solid #cbd2d9; border-radius: 6px; }
    button { padding: 10px 16px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; background: #fff; padding: 10px 12px; margin: 8px 0; border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    li button { background: #dc2626; padding: 4px 10px; }
    .status { font-size: 13px; color: #616e7c; margin-top: 24px; }
  </style>
</head>
<body>
  <h1>Task List</h1>
  <div class="tiers">nginx (frontend) → Node.js (backend) → MySQL (db)</div>

  <form id="add">
    <input id="title" placeholder="New task..." autocomplete="off" required>
    <button type="submit">Add</button>
  </form>

  <ul id="tasks"></ul>
  <div class="status" id="status">checking backend...</div>

  <script>
    const list = document.getElementById("tasks");
    const status = document.getElementById("status");

    async function load() {
      try {
        const res = await fetch("/api/tasks");
        if (!res.ok) throw new Error((await res.json()).error || res.status);
        const tasks = await res.json();
        list.innerHTML = "";
        tasks.forEach(t => {
          const li = document.createElement("li");
          li.textContent = t.title;
          const del = document.createElement("button");
          del.textContent = "Delete";
          del.onclick = async () => { await fetch("/api/tasks/" + t.id, { method: "DELETE" }); load(); };
          li.appendChild(del);
          list.appendChild(li);
        });
        const h = await (await fetch("/api/health")).json();
        status.textContent = "backend version: " + h.version + " · " + tasks.length + " task(s) in MySQL";
      } catch (e) {
        status.textContent = "backend/db error: " + e.message;
      }
    }

    document.getElementById("add").onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById("title");
      await fetch("/api/tasks", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title: input.value })
      });
      input.value = "";
      load();
    };

    load();
  </script>
</body>
</html>
