# ───────────────────────────────────────────────
# gp3 StorageClass: tells the EBS CSI driver what kind of disk to create
# Cluster-wide object (not in a namespace)
# ───────────────────────────────────────────────
{{- if .Values.storageClass.create }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storageClass.name }}
  labels:
    {{- include "three-tier.labels" . | nindent 4 }}
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
volumeBindingMode: WaitForFirstConsumer   # create the disk in the same AZ as the pod
reclaimPolicy: Delete                     # deleting the PVC deletes the EBS volume
allowVolumeExpansion: true
{{- end }}
